name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded PR runs are cancelled; runs on main are not. A main run carries
# the deploy job, and cancelling mid-`wrangler deploy` can leave the three
# workers on mismatched versions — factory service-binds check and lint.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# One job, one install, every gate as its own named step.
#
# Most of these gates run 0-4s against ~16s of per-job setup (runner,
# checkout, pnpm, node, install). Splitting them across six jobs paid that
# setup six times over. On GitHub-hosted runners the case is stronger still,
# since billing rounds each job up to a whole minute — six jobs would bill
# six minutes to do about one minute of work.
#
# Per-gate attribution was the real reason to split, and it survives: each
# gate carries an `if:` so one failure does not skip the rest. A red run
# still names every gate that failed, in one log instead of six.
# Runner: GitHub-hosted, matching sfab-starter (#92). Blacksmith serves the
# older repos instantly but consistently made this one wait ~13 minutes for a
# runner to execute ~32 seconds of gates — apparently because a day-old repo
# has no warm capacity there. The queue cost dwarfed any speed advantage.
# This repo is private, so these minutes draw on the monthly private-repo
# allowance rather than being free as they are for the public starter.
jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      # Every gate below runs whenever the install succeeded, even if an
      # earlier gate failed — that is what keeps per-gate attribution.
      - name: workspace
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:workspace

      # The seed payload must also be clean under the config the factory
      # lints apps with — a different config from the repo's own, since the
      # lint worker cannot resolve `extends` in WASM.
      - name: app-lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:app-lint

      - name: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint:check

      - name: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: cycles
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:cycles

      - name: dead-code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:dead-code

      # Rebuilds from packages/kernel/universe (isolated lockfile) and fails
      # if any committed vendor / generated / kernel.json byte changed.
      - name: kernel
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:kernel

      # The seed is a committed build artifact. Without this, editing the
      # template and forgetting to re-bake ships a factory that keeps seeding
      # the old source, with every other gate green.
      - name: seed
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:seed

      # The template's snapshot is what a seeded app's first `db:generate`
      # diffs against. Editing the template schema without re-baking it would
      # have that first migration propose creating tables the seed already
      # created.
      - name: template snapshot
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:template-snapshot

      # One TS program over the types VFS retains ~320 MB against a 128 MB
      # isolate, so the check worker may hold state for at most one app. When
      # it held one per appId, the second distinct app in an isolate killed it
      # — in production that was 4 of 6 create attempts, with the retry
      # succeeding, which reads as flakiness rather than as a leak.
      - name: check-memory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:check-memory

      # Types VFS export names must be a subset of the matching vendor chunk's
      # esbuild metafile exports. Catches "typechecks clean, throws at
      # runtime" kernel skew (hono/validator, @base-ui/react bailout).
      - name: export-agreement
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check:export-agreement

      # Factory assets (`ui/dist`) are gitignored. wrangler deploy --dry-run
      # fails if assets.directory is missing, so build the console before the
      # bundle-size gate that proves the assets wiring deploys.
      - id: ui-build
        name: ui-build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @sfab-lite/factory build:ui

      # The only gate that inspects the *built* bundle rather than source.
      # apps/lint ships Biome's WASM at ~91% of Cloudflare's 10 MB Worker
      # limit, so a dependency bump can break deployability with nothing
      # else in this file noticing. Slower than the others (three esbuild
      # dry-run builds), hence last.
      - name: bundle-size
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.ui-build.outcome == 'success' }}
        run: pnpm check:bundle-size

  # Deploying is part of CI here, not a separate workflow on the same trigger.
  # sfab splits them, and that split lets a deploy race its own gates and ship
  # a red commit. `needs: gates` makes that impossible. It matters more in this
  # repo than in sfab: the lint worker sits at ~95% of Cloudflare's 10 MB
  # upload limit, so a dependency bump can make the deploy itself fail, and
  # `check:bundle-size` is what catches it first.
  deploy:
    needs: gates
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    # Queue deploys rather than cancelling them; a half-applied deploy leaves
    # factory bound to workers it was not built against.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `apps/factory/ui/dist` is gitignored and the factory's `assets`
      # binding points at it, so the console must exist before its worker
      # deploys or wrangler uploads an empty asset directory.
      - name: Build console
        run: pnpm --filter @sfab-lite/factory build:ui

      # Publish THIS version's client chunks to R2 while it is still current,
      # so that after the next kernel bump the now-previous version is already
      # served from R2 instead of 409ing. Uploading only on a version change
      # would never publish the outgoing version — the one that matters.
      #
      # Idempotent (a present version manifest short-circuits), and it runs
      # before any deploy so a failure here ships nothing. Not a
      # wrangler-action step: this is a node script that shells out to
      # wrangler itself, so it takes the credentials as env.
      - name: Upload kernel chunks to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @sfab-lite/factory upload-kernel-r2 -- --remote

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/factory
          command: d1 migrations apply sfab-lite-factory --remote

      # Order is load-bearing: factory service-binds check and lint, so they
      # must already be deployed when it comes up.
      - name: Deploy check
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/check
          command: deploy

      - name: Deploy lint
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/lint
          command: deploy

      - name: Deploy factory
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/factory
          command: deploy

      # The only check that runs against what was actually deployed. Every
      # gate above reads the source tree, and the failure this catches is
      # invisible there: an app's HTML pins `/kernel/<its version>/client/*`,
      # so bumping the kernel moves those chunks out of the Worker bundle and
      # into R2. If the upload did not happen, every published app renders an
      # empty #root while the whole repo stays green.
      #
      # Unconditional. An earlier draft skipped when the variables were unset,
      # so that a repo without a canary could still deploy — but both are set
      # now, and that shape means deleting a variable silently turns the smoke
      # test off forever. Failing on absence is the only version that cannot be
      # disabled by accident; the script exits 2 with what to set.
      - name: Smoke test canary app
        env:
          SFAB_LITE_ORIGIN: ${{ vars.SFAB_LITE_ORIGIN }}
          CANARY_APP_ID: ${{ vars.CANARY_APP_ID }}
        run: pnpm smoke:canary
